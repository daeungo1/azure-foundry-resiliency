<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Case A same-model same-version regional failover</title>
  <desc id="desc">A request for GPT 6.1 Sol first tries a nearby regional endpoint and then another healthy region with the same version. Retry-After is honored, attempts and deadline are bounded. No other model is selected. Onboarded models share quota across regions in a subscription.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#365977"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047}.h{font-size:25px;font-weight:700}.l{font-size:17px;font-weight:600}.n{font-size:14px}.a{fill:none;stroke:#365977;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="450" fill="#f4f8fc"/>
  <text x="30" y="42" class="h">Case A | same model + pinned version only</text>
  <text x="30" y="74" class="n">Example: gpt-6.1-sol, version 2026-09-29. Market preference chooses the first resource region.</text>
  <rect x="30" y="150" width="180" height="100" rx="12" fill="#fff" stroke="#7aa2bf"/>
  <text x="120" y="190" text-anchor="middle" class="l">Agent request</text>
  <text x="120" y="217" text-anchor="middle" class="n">fallback disabled</text>
  <path d="M210 200H264" class="a"/>
  <rect x="270" y="137" width="230" height="126" rx="12" fill="#e5f0ff" stroke="#4384b9"/>
  <text x="385" y="174" text-anchor="middle" class="l">Nearby endpoint</text>
  <text x="385" y="202" text-anchor="middle" class="n">same model/version</text>
  <text x="385" y="230" text-anchor="middle" class="n">429 / transient error</text>
  <path d="M500 200H604" class="a"/>
  <text x="552" y="177" text-anchor="middle" class="n">cooldown</text>
  <rect x="610" y="137" width="230" height="126" rx="12" fill="#e3f3ed" stroke="#4d957a"/>
  <text x="725" y="174" text-anchor="middle" class="l">Next healthy region</text>
  <text x="725" y="202" text-anchor="middle" class="n">same model/version</text>
  <text x="725" y="230" text-anchor="middle" class="n">respect headroom</text>
  <path d="M840 200H924" class="a"/>
  <rect x="930" y="137" width="240" height="126" rx="12" fill="#fff" stroke="#7aa2bf"/>
  <text x="1050" y="174" text-anchor="middle" class="l">Success or explicit failure</text>
  <text x="1050" y="202" text-anchor="middle" class="n">bounded total attempts</text>
  <text x="1050" y="230" text-anchor="middle" class="n">bounded first-response deadline</text>
  <rect x="30" y="310" width="1140" height="95" rx="12" fill="#fff0d8" stroke="#c9994c"/>
  <text x="55" y="343" class="l">One subscription is not one independent quota allocation per regional endpoint.</text>
  <text x="55" y="372" class="n">Check actual quota Scope. Global Standard inference capacity can remain correlated across all candidates.</text>
  <text x="30" y="433" class="n">401/403, invalid input and safety refusal do not trigger model fallback. First text emitted = no automatic replay.</text>
</svg>
