name: Validate reference lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run python -m pytest -q
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv build --wheel
      - name: Compile Bicep and example parameters
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: |
          az bicep install
          az bicep build --file infra\main.bicep --outfile artifacts\main.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          az bicep build-params --file infra\main.bicepparam --outfile artifacts\main.parameters.json
          exit $LASTEXITCODE
